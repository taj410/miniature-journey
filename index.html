<style>
  :root{
    --navy-900:#0B2540;
    --navy-800:#0F2E4E;
    --navy-700:#163C63;
    --steel-600:#2E5C7A;
    --gold-600:#B8842A;
    --gold-700:#9C6E20;
    --bg:#F4F6F8;
    --card:#FFFFFF;
    --line:#E4E8EC;
    --text-900:#152233;
    --text-600:#4B5765;
    --text-400:#8B96A3;
    --green:#1E8E5A; --green-bg:#E7F5EE;
    --red:#C6403C; --red-bg:#FBEAEA;
    --amber:#D98C1F; --amber-bg:#FBF1E1;
    --gray:#7B8794; --gray-bg:#EEF0F2;
    --blue:#2563AC; --blue-bg:#E9F1FB;
    --radius:10px;
    --shadow:0 1px 2px rgba(15,35,60,.06), 0 4px 14px rgba(15,35,60,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Tajawal','IBM Plex Sans Arabic',Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text-900);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{text-decoration:none; color:inherit;}
  ::selection{background:var(--gold-600); color:#fff;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(184,132,42,.10), transparent 40%),
      linear-gradient(160deg, var(--navy-900) 0%, var(--navy-800) 55%, var(--steel-600) 100%);
    padding:20px;
  }
  .login-card{
    width:100%; max-width:400px; background:var(--card); border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.35); padding:36px 32px; text-align:center;
  }
  .login-crest{
    width:84px; height:84px; margin:0 auto 14px; border-radius:16px;
    background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; padding:8px;
    box-shadow:0 6px 16px rgba(15,35,60,.08);
  }
  .login-crest img{width:100%; height:100%; object-fit:contain;}
  .login-card h1{font-size:19px; margin:0 0 2px; color:var(--navy-900);}
  .login-card p.sub{color:var(--text-400); font-size:13px; margin:0 0 26px;}
  .field{text-align:right; margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--text-600); margin-bottom:6px; font-weight:500;}
  .field input, .field select{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; background:#FBFCFD; transition:.15s;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--steel-600); background:#fff; box-shadow:0 0 0 3px rgba(46,92,122,.12);}
  .btn{
    border:none; border-radius:8px; padding:11px 18px; font-size:14px; font-weight:700;
    transition:.15s; display:inline-flex; align-items:center; gap:6px; justify-content:center;
  }
  .btn-primary{background:var(--navy-900); color:#fff; width:100%;}
  .btn-primary:hover{background:var(--navy-700);}
  .btn-gold{background:var(--gold-600); color:#fff;}
  .btn-gold:hover{background:var(--gold-700);}
  .btn-ghost{background:transparent; color:var(--text-600); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--bg);}
  .btn-danger{background:var(--red-bg); color:var(--red);}
  .btn-danger:hover{background:#f5d6d5;}
  .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:7px;}
  .login-hint{
    margin-top:18px; background:var(--blue-bg); color:var(--blue); font-size:12px;
    padding:10px 12px; border-radius:8px; text-align:right; line-height:1.9;
  }
  .login-error{background:var(--red-bg); color:var(--red); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:14px; display:none;}

  /* ---------- Shell ---------- */
  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:250px; flex-shrink:0; background:var(--navy-900); color:#cfd9e3;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .sidebar::-webkit-scrollbar{width:6px;}
  .sidebar::-webkit-scrollbar-thumb{background:var(--navy-700); border-radius:3px;}
  .brand{
    display:flex; align-items:center; gap:10px; padding:18px 16px; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand .mark{
    width:42px; height:42px; border-radius:9px; background:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:4px;
  }
  .brand .mark img{width:100%; height:100%; object-fit:contain;}
  .brand .name{font-size:13.5px; font-weight:700; color:#fff; line-height:1.4;}
  .brand .name small{display:block; font-weight:400; color:#93a3b3; font-size:10.5px; margin-top:1px;}
  .nav-group-title{font-size:10.5px; color:#5f7488; padding:14px 18px 6px; font-weight:700; letter-spacing:.5px;}
  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 16px; margin:1px 8px; border-radius:8px; font-size:13.5px; color:#c3ceda;
    cursor:pointer; transition:.12s;
  }
  .nav-item .lbl{display:flex; align-items:center; gap:9px;}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:#3d5670;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:var(--gold-600); color:#fff; font-weight:700;}
  .nav-item.active .dot{background:#fff;}
  .nav-item.dormant{opacity:.4; cursor:not-allowed;}
  .nav-item.dormant:hover{background:transparent; color:#c3ceda;}
  .badge-soon{font-size:9.5px; background:rgba(255,255,255,.08); color:#93a3b3; padding:2px 6px; border-radius:20px; flex-shrink:0;}
  .sidebar-foot{margin-top:auto; padding:14px 16px; border-top:1px solid rgba(255,255,255,.08); font-size:11px; color:#5f7488;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center;
    justify-content:space-between; padding:0 22px; position:sticky; top:0; z-index:5; gap:16px;
  }
  .topbar .search{
    flex:1; max-width:360px; position:relative;
  }
  .topbar .search input{
    width:100%; padding:9px 14px 9px 14px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:var(--bg);
  }
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .icon-btn{
    width:36px; height:36px; border-radius:8px; border:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; position:relative; color:var(--text-600);
  }
  .icon-btn .pip{
    position:absolute; top:-4px; left:-4px; background:var(--red); color:#fff; font-size:9.5px;
    min-width:16px; height:16px; border-radius:20px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  .user-chip{display:flex; align-items:center; gap:9px; padding:5px 10px 5px 6px; border-radius:30px; border:1px solid var(--line); cursor:pointer;}
  .user-menu{display:none; position:absolute; top:calc(100% + 8px); left:0; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 32px rgba(15,35,60,.18); min-width:210px; z-index:50; overflow:hidden;}
  .user-menu.open{display:block;}
  .user-menu-head{padding:12px 16px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:2px;}
  .user-menu-head b{font-size:13px; color:var(--navy-900);}
  .user-menu-head span{font-size:11px; color:var(--text-400);}
  .user-menu-item{display:flex; align-items:center; gap:8px; width:100%; padding:12px 16px; border:none; background:none; text-align:right; font-size:13px; color:var(--red); font-weight:600; cursor:pointer;}
  .user-menu-item:hover{background:var(--red-bg);}
  .avatar{width:28px; height:28px; border-radius:50%; background:var(--navy-800); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}
  .user-chip .who{font-size:12.5px; line-height:1.3;}
  .user-chip .who b{display:block; font-size:12.5px;}
  .user-chip .who span{color:var(--text-400); font-size:10.5px;}

  .content{padding:24px; flex:1;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  .page-head h2{margin:0 0 4px; font-size:20px; color:var(--navy-900);}
  .page-head p{margin:0; color:var(--text-400); font-size:13px;}
  .crumbs{font-size:12px; color:var(--text-400); margin-bottom:6px;}

  .kpi-section{margin-bottom:26px;}
  .kpi-section-title{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--navy-900); margin-bottom:10px;}
  .kpi-section-title .bar{width:4px; height:16px; border-radius:3px; background:var(--gold-600);}
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px;}
  .kpi-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;
    box-shadow:var(--shadow); cursor:pointer; transition:.15s; position:relative; overflow:hidden;
  }
  .kpi-card:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(15,35,60,.10);}
  .kpi-card .num{font-size:26px; font-weight:800; color:var(--navy-900); line-height:1;}
  .kpi-card .lbl{font-size:12px; color:var(--text-600); margin-top:6px;}
  .kpi-card::before{content:''; position:absolute; top:0; right:0; width:4px; height:100%; background:var(--c,var(--steel-600));}

  .status-bar{display:flex; height:8px; border-radius:6px; overflow:hidden; background:var(--gray-bg); margin-top:8px;}
  .status-bar span{height:100%;}
  .status-legend{display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--text-600); margin-top:8px;}
  .status-legend i{width:8px; height:8px; border-radius:2px; display:inline-block; margin-inline-end:4px;}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
  .panel + .panel{margin-top:16px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  .panel-head h3{margin:0; font-size:15px; color:var(--navy-900);}
  .panel-head p{margin:2px 0 0; font-size:12px; color:var(--text-400);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:right; color:var(--text-400); font-weight:600; font-size:11.5px; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:11px 10px; border-bottom:1px solid var(--line); color:var(--text-900);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#FBFCFD;}
  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .pill.on{background:var(--green-bg); color:var(--green);}
  .pill.off{background:var(--gray-bg); color:var(--gray);}
  .pill.danger{background:var(--red-bg); color:var(--red);}
  .row-actions{display:flex; gap:6px;}
  .icon-link{width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--text-600);}
  .icon-link:hover{background:var(--bg);}

  .chip{display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); padding:5px 11px; border-radius:20px; font-size:12.5px; margin:3px;}
  .chip button{background:none; border:none; color:var(--red); font-size:14px; line-height:1; padding:0;}
  .chips-wrap{display:flex; flex-wrap:wrap; margin:-3px; margin-bottom:10px;}
  .add-chip-row{display:flex; gap:8px;}
  .add-chip-row input{flex:1;}

  .empty-state{text-align:center; padding:50px 20px; color:var(--text-400);}
  .empty-state .ic{font-size:34px; margin-bottom:10px;}
  .empty-state h4{color:var(--text-600); margin:0 0 4px; font-size:14.5px;}
  .empty-state p{margin:0; font-size:12.5px;}

  .soon-wrap{display:flex; align-items:center; justify-content:center; min-height:60vh;}
  .soon-card{text-align:center; max-width:420px;}
  .soon-card .ic{width:64px; height:64px; border-radius:16px; background:var(--amber-bg); color:var(--amber); display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 16px;}
  .soon-card h3{color:var(--navy-900); margin:0 0 8px;}
  .soon-card p{color:var(--text-400); font-size:13.5px; line-height:1.8; margin:0 0 4px;}
  .soon-card .step-tag{display:inline-block; margin-top:14px; background:var(--bg); border:1px solid var(--line); padding:6px 14px; border-radius:20px; font-size:12px; color:var(--text-600);}

  .modal-bg{position:fixed; inset:0; background:rgba(11,37,64,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal{background:#fff; border-radius:14px; width:100%; max-width:460px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0; font-size:15.5px; color:var(--navy-900);}
  .modal-close{width:30px; height:30px; border-radius:8px; border:none; background:var(--bg); color:var(--text-600); font-size:15px;}
  .modal-body{padding:20px;}
  .modal-foot{display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--line); justify-content:flex-end;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){.grid2{grid-template-columns:1fr;}}
  .switch{display:flex; align-items:center; gap:10px; justify-content:space-between; padding:10px 0;}
  .switch-toggle{width:42px; height:24px; border-radius:20px; background:var(--gray-bg); position:relative; cursor:pointer; transition:.15s; flex-shrink:0;}
  .switch-toggle.on{background:var(--green);}
  .switch-toggle::after{content:''; width:18px; height:18px; border-radius:50%; background:#fff; position:absolute; top:3px; right:3px; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch-toggle.on::after{right:21px;}

  .perm-table th, .perm-table td{text-align:center;}
  .perm-table td:first-child, .perm-table th:first-child{text-align:right;}
  .perm-table input[type=checkbox]{width:16px; height:16px; accent-color:var(--gold-600);}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--navy-900); color:#fff; padding:12px 22px; border-radius:30px; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.3); z-index:100; display:none; gap:8px; align-items:center;}

  /* ---------- Phase 2: vehicles / drivers / detail pages ---------- */
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
  .toolbar select, .toolbar input{padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff;}
  .toolbar input{flex:1; min-width:160px;}
  .status-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-inline-end:6px; flex-shrink:0;}
  .name-cell{display:flex; align-items:center; gap:10px;}
  .avatar-sm{width:32px; height:32px; border-radius:9px; background:var(--navy-800); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; flex-shrink:0;}
  .clickable-row{cursor:pointer;}

  .detail-head{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
  .detail-title{display:flex; align-items:center; gap:14px;}
  .avatar-lg{width:56px; height:56px; border-radius:14px; background:var(--navy-800); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; flex-shrink:0;}
  .detail-title h2{margin:0 0 3px; font-size:19px; color:var(--navy-900);}
  .detail-title .meta{font-size:12.5px; color:var(--text-400); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto;}
  .tab-btn{padding:10px 16px; font-size:13px; font-weight:600; color:var(--text-400); border:none; background:none; border-bottom:2px solid transparent; white-space:nowrap;}
  .tab-btn.active{color:var(--navy-900); border-bottom-color:var(--gold-600);}

  .info-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px;}
  .info-item{}
  .info-item label{display:block; font-size:11px; color:var(--text-400); margin-bottom:3px;}
  .info-item div{font-size:13.5px; color:var(--text-900); font-weight:500;}
  .section-title{font-weight:700; font-size:12.5px; color:var(--navy-900); margin:16px 0 10px; display:flex; align-items:center; gap:7px;}
  .section-title .bar{width:3px; height:13px; border-radius:2px; background:var(--gold-600);}
  .section-title:first-child{margin-top:0;}

  .timeline{position:relative; padding-inline-start:24px;}
  .timeline::before{content:''; position:absolute; inset-inline-start:5px; top:4px; bottom:4px; width:2px; background:var(--line);}
  .tl-item{position:relative; padding-bottom:20px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{content:''; position:absolute; inset-inline-start:-24px; top:2px; width:12px; height:12px; border-radius:50%; background:var(--gold-600); border:2px solid #fff; box-shadow:0 0 0 2px var(--line);}
  .tl-item .tl-date{font-size:11.5px; color:var(--text-400); margin-bottom:2px;}
  .tl-item .tl-desc{font-size:13.5px; color:var(--text-900); font-weight:500;}
  .tl-item .tl-by{font-size:11px; color:var(--text-400); margin-top:2px;}

  .placeholder-note{background:var(--bg); border:1px dashed var(--line); border-radius:8px; padding:16px; text-align:center; color:var(--text-400); font-size:12.5px;}
  textarea.f-textarea{width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#FBFCFD; resize:vertical; min-height:70px; font-family:inherit;}
  .priority-pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;}
  .mini-table td, .mini-table th{padding:8px 9px; font-size:12.5px;}
  .msg-item{padding:14px 16px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:12px; align-items:flex-start;}
  .msg-item:hover{background:var(--bg);}
  .msg-item.unread{background:#FBF7EE;}
  .msg-item .msg-dot{width:9px; height:9px; border-radius:50%; background:var(--gold-600); flex-shrink:0; margin-top:5px;}
  .msg-item.read .msg-dot{background:transparent;}
  .msg-subject{font-weight:700; font-size:13.5px; color:var(--navy-900);}
  .msg-meta{font-size:11.5px; color:var(--text-400); margin-top:2px;}
  .msg-body-view{white-space:pre-wrap; font-size:13.5px; line-height:1.9; color:var(--text-900); background:var(--bg); border-radius:8px; padding:14px; margin-top:10px;}

  .mobile-topbar{display:none;}
  @media (max-width:900px){
    .sidebar{position:fixed; z-index:40; transform:translateX(100%); transition:.2s; box-shadow:0 0 40px rgba(0,0,0,.3);}
    .sidebar.open{transform:translateX(0);}
    .backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35;}
    .backdrop.open{display:block;}
    .topbar .search{display:none;}
    .content{padding:16px;}
  }
</style>

/* ======================= SYNC ENGINE (push/pull/realtime) ======================= */
let syncPushTimers = {};
let lastConnState = false;
let firstPullDone = false; // guards against pushing local defaults before we know what's already on the server
function syncPush(key, value){
  if(!sb) return;
  if(!firstPullDone){ return; } // safety net: never push anything until the initial pull has completed at least once
  clearTimeout(syncPushTimers[key]);
  syncPushTimers[key] = setTimeout(()=>{
    sb.from(SYNC_TABLE).upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict:'key' })
      .then(({error})=>{ if(error){ console.warn('sync push error', key, error); setConnStatus(false); } else { setConnStatus(true); } });
  }, 250);
}
async function syncPullAll(){
  if(!sb) return false;
  try{
    const { data, error } = await sb.from(SYNC_TABLE).select('key,value');
    if(error){ console.warn('sync pull error', error); setConnStatus(false); window.__syncError = error; return false; }
    (data||[]).forEach(row=>{ dsetLocalOnly(row.key, row.value); });
    firstPullDone = true; // only now is it safe to let local writes reach the shared database
    setConnStatus(true);
    return true;
  }catch(e){ console.warn('sync pull exception', e); setConnStatus(false); window.__syncError = e; return false; }
}
let remoteRenderTimer = null;
function handleRemoteChange(row){
  if(!row || !row.key) return;
  const incoming = JSON.stringify(row.value);
  if(localStorage.getItem(row.key) === incoming) return; // our own echo, ignore
  dsetLocalOnly(row.key, row.value);
  // always refresh lightweight indicators
  if(row.key===DBK.messages){ checkNewMessagesTone(); renderMailBell(); }
  if(row.key===DBK.tasks){ checkNewNotificationsTone(); }
  renderNotifBell();
  // avoid disrupting an open modal / active typing with a full re-render
  if(document.querySelector('.modal-bg')) return;
  clearTimeout(remoteRenderTimer);
  remoteRenderTimer = setTimeout(()=>{ if(currentUser()) route(); }, 300);
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('taj_sync_channel')
    .on('postgres_changes', { event:'*', schema:'public', table:SYNC_TABLE }, payload=>{
      handleRemoteChange(payload.new || payload.old);
    })
    .subscribe(status=>{ if(status==='SUBSCRIBED') setConnStatus(true); });
}
function setConnStatus(connected){
  lastConnState = connected;
  const el = document.getElementById('connStatus');
  if(!el) return;
  el.title = connected? 'متصل بقاعدة البيانات المشتركة' : 'غير متصل — يعمل بالبيانات المحلية فقط';
  el.style.background = connected? 'var(--green)' : 'var(--red)';
}

function defaultPermissions(){
  const perm = {};
  ROLES.forEach(r=>{
    perm[r.id] = {};
    MODULES.forEach(m=>{
      perm[r.id][m.id] = {view:false, add:false, edit:false, delete:false, approve:false};
    });
  });
  // admin: full access
  MODULES.forEach(m=> Object.assign(perm.admin[m.id], {view:true, add:true, edit:true, delete:true, approve:true}));
  // ops
  Object.assign(perm.ops.vehicles, {view:true, edit:true});
  Object.assign(perm.ops.drivers, {view:true});
  Object.assign(perm.ops.tasks, {view:true, add:true, edit:true});
  Object.assign(perm.ops.accidents, {view:true, add:true, edit:true});
  Object.assign(perm.ops.violations, {view:true, add:true, edit:true});
  Object.assign(perm.ops.maintenance, {view:true, add:true, edit:true});
  Object.assign(perm.ops.reports, {view:true});
  Object.assign(perm.finance.finance, {view:true, add:true, edit:true});
  Object.assign(perm.finance.reports, {view:true});
  // hr
  Object.assign(perm.hr.drivers, {view:true, edit:true});
  Object.assign(perm.hr.hr, {view:true, add:true, edit:true, approve:true});
  Object.assign(perm.hr.reports, {view:true});
  // supervisor
  Object.assign(perm.supervisor.vehicles, {view:true});
  Object.assign(perm.supervisor.drivers, {view:true});
  Object.assign(perm.supervisor.tasks, {view:true, add:true, edit:true});
  return perm;
}

        driverStatuses:['على رأس العمل','متوقف','إجازة','موقوف','منقول','منتهي الخدمة','بدون سيارة'],
        requestTypes:['طلب إجازة','طلب نقل','طلب نقل كفالة','طلب تغيير سيارة','طلب تحديث بيانات','طلب مباشرة','طلب عودة من إجازة','طلب إنهاء خدمة'],

        leaveTypes:['سنوية','مرضية','طارئة','بدون راتب','حج/عمرة'],
      }
    });
  }
  Object.values(DBK).forEach(k=>{ if(!localStorage.getItem(k)) setter(k, k===DBK.settings||k===DBK.users? dget(k,{}) : []); });
  if(!localStorage.getItem(DBK.audit)) setter(DBK.audit, []);
  // migration safety: ensure lists/keys added in later phases exist for users with older saved data
  const s = dget(DBK.settings, {});
  let touched = false;
  if(!s.lists) { s.lists = {}; touched = true; }
  const defaults = {
    vehicleStatuses:['تعمل','متوقفة','في الصيانة','حادث','خارج الخدمة','بدون مندوب','احتياطية'],
    driverStatuses:['على رأس العمل','متوقف','إجازة','موقوف','منقول','منتهي الخدمة','بدون سيارة'],
    requestTypes:['طلب إجازة','طلب نقل','طلب نقل كفالة','طلب تغيير سيارة','طلب تحديث بيانات','طلب مباشرة','طلب عودة من إجازة','طلب إنهاء خدمة'],
    taskTypes:['توصيل طلبات','استلام سيارة','تسليم سيارة','صيانة دورية','مهمة إدارية','مهمة ميدانية','أخرى'],
    accidentTypes:['تصادم','انقلاب','دهس','حريق','أضرار جزئية','أخرى'],
    maintenanceTypes:['صيانة دورية','تغيير زيت','تغيير إطارات','تغيير بطارية','أعطال','إصلاحات','صيانة بسبب حادث'],
    violationTypes:['تجاوز السرعة','عبور إشارة حمراء','وقوف مخالف','عدم ربط الحزام','استخدام الجوال أثناء القيادة','أخرى'],
    claimTypes:['بدل انتقال','بدل أضرار','مستحقات متأخرة','أخرى'],
    deductionTypes:['غياب','تأخير','مخالفة نظام','ضرر بالسيارة','أخرى'],
    leaveTypes:['سنوية','مرضية','طارئة','بدون راتب','حج/عمرة'],
  };
  Object.keys(defaults).forEach(k=>{ if(!s.lists[k]){ s.lists[k]=defaults[k]; touched=true; } });
  if(!s.supervisors){ s.supervisors=[]; touched=true; }
  if(!s.permissions){ s.permissions=defaultPermissions(); touched=true; }
  // migration: ensure every role has every module key (covers modules added in later updates, e.g. 'audit')
  ROLES.forEach(r=>{
    if(!s.permissions[r.id]) { s.permissions[r.id] = {}; touched = true; }
    MODULES.forEach(m=>{
      if(!s.permissions[r.id][m.id]){
        s.permissions[r.id][m.id] = r.id==='admin'
          ? {view:true, add:true, edit:true, delete:true, approve:true}
          : {view:false, add:false, edit:false, delete:false, approve:false};
        touched = true;
      }
    });
  });
  if(touched) setter(DBK.settings, s);
}

function logAudit(action, module, detail){
  const list = dget(DBK.audit, []);
  const u = currentUser();
  list.unshift({
    id: uid('log'), user: u? u.name : 'النظام', role: u? roleName(u.role): '-',
    action, module, detail, at: new Date().toISOString()
  });
  dset(DBK.audit, list.slice(0,500));
}
function roleName(id){ const r = ROLES.find(x=>x.id===id); return r? r.name : id; }
function currentUser(){
  const sid = sessionStorage.getItem(DBK.session);
  if(!sid) return null;
  return dget(DBK.users, []).find(u=>u.id===sid) || null;
}
function can(moduleId, action){
  const u = currentUser(); if(!u) return false;
  const settings = dget(DBK.settings, {});
  const perm = settings.permissions || {};
  return !!(perm[u.role] && perm[u.role][moduleId] && perm[u.role][moduleId][action]);
}

function countExpiringDocs(){
  const vehicles = dget(DBK.vehicles, []);
  const drivers = dget(DBK.drivers, []);
  const now = new Date();
  const in30 = new Date(now.getTime() + 30*24*60*60*1000);
  const isSoon = (d)=> d && new Date(d) >= now && new Date(d) <= in30;
  let count = 0;
  vehicles.forEach(v=>{
    if(isSoon(v.insuranceExpiry)) count++;
    if(isSoon(v.registrationExpiry)) count++;
    if(isSoon(v.inspectionExpiry)) count++;
    if(isSoon(v.nextMaintenance)) count++;
  });
  drivers.forEach(d=>{ if(isSoon(d.licenseExpiry)) count++; });
  return count;
}

function saveUser(id){
  const name = document.getElementById('f_name').value.trim();
  const username = document.getElementById('f_username').value.trim();
  const password = document.getElementById('f_password').value.trim();
  if(!name || !username || !password){ toast('الرجاء تعبئة الاسم واسم المستخدم وكلمة المرور'); return; }
  const role = document.getElementById('f_role').value;
  const department = document.getElementById('f_department').value.trim();
  const phone = document.getElementById('f_uphone').value.trim();
  const active = document.getElementById('f_active').classList.contains('on');
  let users = dget(DBK.users, []);
  if(id){
    const dup = users.find(u=>u.username===username && u.id!==id);
    if(dup){ toast('اسم المستخدم مستخدم بالفعل'); return; }
    const idx = users.findIndex(u=>u.id===id);
    const before = JSON.stringify(users[idx]);
    users[idx] = {...users[idx], name, username, password, role, department, phone, active};
    logAudit('تعديل مستخدم','المستخدمون', `تعديل بيانات المستخدم "${name}"`);
  } else {
    const dup = users.find(u=>u.username===username);
    if(dup){ toast('اسم المستخدم مستخدم بالفعل'); return; }
    users.push({id:uid('u'), name, username, password, role, department, phone, active, createdAt:new Date().toISOString()});
    logAudit('إضافة مستخدم','المستخدمون', `تمت إضافة مستخدم جديد "${name}" بدور ${roleName(role)}`);
  }
  dset(DBK.users, users);
  closeModal('userModalBg');
  pageUsers();
  toast('تم الحفظ بنجاح');
}
function deleteUser(id){
  const users = dget(DBK.users, []);
  const u = users.find(x=>x.id===id);
  if(!confirm(`هل تريد تعطيل المستخدم "${u.name}"؟ (لن يتم حذف السجل نهائيًا حفاظًا على سجل التدقيق)`)) return;
  const idx = users.findIndex(x=>x.id===id);

function pushVehicleEvent(vehicleId, type, desc){
  const events = dget(DBK.vehicleEvents, []);
  events.unshift({id:uid('vev'), entityId:vehicleId, type, desc, at:new Date().toISOString(), by:(currentUser()||{}).name||'النظام'});
  dset(DBK.vehicleEvents, events);
}
function pushDriverEvent(driverId, type, desc){
  const events = dget(DBK.driverEvents, []);
  events.unshift({id:uid('dev'), entityId:driverId, type, desc, at:new Date().toISOString(), by:(currentUser()||{}).name||'النظام'});
  dset(DBK.driverEvents, events);
}
function renderTimeline(events){
  if(!events.length) return `<div class="empty-state"><div class="ic">🕓</div><h4>لا يوجد سجل تاريخي بعد</h4><p>ستظهر هنا كل الأحداث المرتبطة بهذا السجل بشكل تلقائي</p></div>`;
  return `<div class="timeline">${events.map(e=>`
    <div class="tl-item">
      <div class="tl-date">${fmtDateTime(e.at)} · ${e.type}</div>
      <div class="tl-desc">${e.desc}</div>
      <div class="tl-by">بواسطة: ${e.by}</div>
    </div>`).join('')}</div>`;
}

function renderVehicleTable(){
  const vehicles = dget(DBK.vehicles, []);
  const drivers = dget(DBK.drivers, []);
  let list = vehicles.slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  if(vehicleFilter.status) list = list.filter(v=>v.status===vehicleFilter.status);
  if(vehicleFilter.q){
    const q = vehicleFilter.q.trim();
    list = list.filter(v=> (v.plate||'').includes(q) || (v.internalNo||'').includes(q) || (v.model||'').includes(q) || (v.brand||'').includes(q));
  }
  const tbody = document.getElementById('vehicleTbody');
  if(!tbody) return;
  if(!list.length){
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="ic">🚐</div><h4>لا توجد سيارات مطابقة</h4><p>أضف سيارة جديدة أو عدّل معايير البحث</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(v=>{
    const drv = drivers.find(d=>d.id===v.driverId);
    return `<tr class="clickable-row" onclick="location.hash='#/vehicle/${v.id}'">
      <td><div class="name-cell"><div class="avatar-sm">${initialsOf(v.internalNo||v.plate)}</div><div><b>${v.internalNo||'-'}</b><br><span style="color:var(--text-400); font-size:11.5px;">${v.brand||''} ${v.model||''} ${v.year||''}</span></div></div></td>
      <td>${v.plate||'-'}</td>
      <td>${v.vtype||'-'}</td>
      <td><span class="status-dot" style="background:${statusColor(v.status)}"></span>${v.status||'-'}</td>
      <td>${drv? drv.name : '<span style="color:var(--text-400)">بدون مندوب</span>'}</td>
      <td>${v.supervisor||'-'}</td>
      <td onclick="event.stopPropagation()"><div class="row-actions">${can('vehicles','edit')?`<div class="icon-link" title="تعديل" onclick="openVehicleModal('${v.id}')">✎</div>`:''}</div></td>
    </tr>`;
  }).join('');
}

function saveVehicle(id){
  const internalNo = document.getElementById('f_internalNo').value.trim();
  const plate = document.getElementById('f_plate').value.trim();
  if(!internalNo || !plate){ toast('الرقم الداخلي ورقم اللوحة مطلوبان'); return; }
  let vehicles = dget(DBK.vehicles, []);
  const dup = vehicles.find(v=>v.plate===plate && v.id!==id);
  if(dup){ toast('رقم اللوحة مستخدم بالفعل لسيارة أخرى'); return; }
  const data = {
    internalNo, plate,
    vtype: document.getElementById('f_vtype').value.trim(),
    brand: document.getElementById('f_brand').value.trim(),
    model: document.getElementById('f_model').value.trim(),
    year: document.getElementById('f_year').value.trim(),
    color: document.getElementById('f_color').value.trim(),
    vin: document.getElementById('f_vin').value.trim(),
    ownershipType: document.getElementById('f_ownershipType').value,
    leaseParty: document.getElementById('f_leaseParty').value.trim(),
    contractStart: document.getElementById('f_contractStart').value,
    contractEnd: document.getElementById('f_contractEnd').value,
    rentValue: document.getElementById('f_rentValue').value,
    odometer: document.getElementById('f_odometer').value,
    status: document.getElementById('f_status').value,
    supervisor: document.getElementById('f_supervisor').value,
    receivedDate: document.getElementById('f_receivedDate').value,
    lastMaintenance: document.getElementById('f_lastMaintenance').value,
    nextMaintenance: document.getElementById('f_nextMaintenance').value,
    insuranceExpiry: document.getElementById('f_insuranceExpiry').value,
    registrationExpiry: document.getElementById('f_registrationExpiry').value,
    inspectionExpiry: document.getElementById('f_inspectionExpiry').value,
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(id){
    const idx = vehicles.findIndex(v=>v.id===id);
    const oldStatus = vehicles[idx].status;
    vehicles[idx] = {...vehicles[idx], ...data};
    dset(DBK.vehicles, vehicles);
    if(oldStatus !== data.status){
      pushVehicleEvent(id, 'تغيير حالة', `تغيرت حالة السيارة من "${oldStatus}" إلى "${data.status}" (عبر تعديل البيانات)`);
    }
    logAudit('تعديل سيارة','إدارة الأسطول', `تعديل بيانات السيارة "${plate}"`);
    closeModal('vehicleModalBg');
    if(location.hash.includes('vehicle/'+id)) pageVehicleDetail(id); else pageVehicles();
  } else {
    const nv = {id:uid('veh'), ...data, driverId:null, createdAt:new Date().toISOString()};
    vehicles.push(nv);
    dset(DBK.vehicles, vehicles);
    pushVehicleEvent(nv.id, 'إنشاء', `تم إنشاء ملف السيارة (${plate}) بحالة "${data.status}"`);
    logAudit('إضافة سيارة','إدارة الأسطول', `تمت إضافة سيارة جديدة "${plate}"`);
    closeModal('vehicleModalBg');
    pageVehicles();
  }
  toast('تم الحفظ بنجاح');
}

function changeVehicleStatus(id){
  const status = document.getElementById('f_newStatus').value;
  const note = document.getElementById('f_statusNote').value.trim();
  applyVehicleStatusChange(id, status, note);
  closeModal('statusModalBg');
  pageVehicleDetail(id);
  toast('تم تحديث حالة السيارة');
}
function applyVehicleStatusChange(id, status, note){
  const vehicles = dget(DBK.vehicles, []);
  const idx = vehicles.findIndex(x=>x.id===id);
  if(idx<0) return;
  const old = vehicles[idx].status;
  if(old === status) return;
  vehicles[idx].status = status;
  dset(DBK.vehicles, vehicles);
  pushVehicleEvent(id, 'تغيير حالة', `تغيرت حالة السيارة من "${old}" إلى "${status}"${note?' — '+note:''}`);
  logAudit('تغيير حالة سيارة','إدارة الأسطول', `${vehicles[idx].plate||vehicles[idx].internalNo}: ${old} → ${status}`);
}

function confirmAssignDriver(vehicleId){
  const driverId = document.getElementById('f_assignDriver').value;
  const reason = document.getElementById('f_assignReason').value.trim();
  assignDriverToVehicle(vehicleId, driverId, reason);
  closeModal('assignModalBg');
  pageVehicleDetail(vehicleId);
  toast('تم ربط المندوب بالسيارة');
}
function assignDriverToVehicle(vehicleId, driverId, reason){
  const vehicles = dget(DBK.vehicles, []);
  const drivers = dget(DBK.drivers, []);
  const assignments = dget(DBK.assignments, []);
  const v = vehicles.find(x=>x.id===vehicleId);
  const d = drivers.find(x=>x.id===driverId);
  if(!v || !d) return;
  const now = new Date().toISOString();
  if(v.driverId && v.driverId!==driverId){
    const oldDrv = drivers.find(x=>x.id===v.driverId);
    const openA = assignments.find(a=>a.vehicleId===vehicleId && !a.endDate);
    if(openA) openA.endDate = now;
    if(oldDrv){ oldDrv.vehicleId = null; pushDriverEvent(oldDrv.id, 'تسليم سيارة', `تم تسليم السيارة ${v.plate||v.internalNo} (تغيير مندوب)`); }
    pushVehicleEvent(v.id, 'تسليم', `تم تسليم السيارة من المندوب ${oldDrv? oldDrv.name:'-'}`);
  }
  if(d.vehicleId && d.vehicleId!==vehicleId){
    const oldVeh = vehicles.find(x=>x.id===d.vehicleId);
    const openA2 = assignments.find(a=>a.driverId===driverId && !a.endDate);
    if(openA2) openA2.endDate = now;
    if(oldVeh){ oldVeh.driverId = null; pushVehicleEvent(oldVeh.id, 'بدون مندوب', `أصبحت السيارة بدون مندوب بعد انتقال ${d.name} إلى سيارة أخرى`); }
  }
  assignments.push({id:uid('asg'), driverId, vehicleId, startDate:now, endDate:null, reason:reason||'', changedBy:(currentUser()||{}).name||'-'});
  v.driverId = driverId; d.vehicleId = vehicleId;
  dset(DBK.vehicles, vehicles); dset(DBK.drivers, drivers); dset(DBK.assignments, assignments);
  pushVehicleEvent(v.id, 'استلام', `استلم المندوب ${d.name} السيارة${reason?' — السبب: '+reason:''}`);
  pushDriverEvent(d.id, 'استلام سيارة', `استلم السيارة ${v.plate||v.internalNo}${reason?' — السبب: '+reason:''}`);
  logAudit('ربط مندوب بسيارة','إدارة الأسطول', `تم ربط "${d.name}" بالسيارة "${v.plate||v.internalNo}"`);
}
function unassignVehicle(vehicleId){
  if(!confirm('هل تريد إنهاء ربط المندوب الحالي بهذه السيارة؟')) return;
  const vehicles = dget(DBK.vehicles, []);
  const drivers = dget(DBK.drivers, []);
  const assignments = dget(DBK.assignments, []);
  const v = vehicles.find(x=>x.id===vehicleId);
  if(!v || !v.driverId) return;
  const d = drivers.find(x=>x.id===v.driverId);
  const now = new Date().toISOString();
  const openA = assignments.find(a=>a.vehicleId===vehicleId && !a.endDate);
  if(openA) openA.endDate = now;
  if(d){ d.vehicleId=null; pushDriverEvent(d.id,'تسليم سيارة', `تم تسليم السيارة ${v.plate||v.internalNo}`); }
  v.driverId = null;
  dset(DBK.vehicles, vehicles); dset(DBK.drivers, drivers); dset(DBK.assignments, assignments);
  pushVehicleEvent(v.id, 'بدون مندوب', `تم إنهاء ربط المندوب ${d?d.name:'-'}`);
  logAudit('فك ربط مندوب','إدارة الأسطول', `تم إنهاء ربط المندوب عن السيارة "${v.plate||v.internalNo}"`);
  pageVehicleDetail(vehicleId);
  toast('تم إنهاء الربط');
}

function saveDriver(id){
  const name = document.getElementById('f_dname').value.trim();
  const nationalId = document.getElementById('f_nationalId').value.trim();
  if(!name || !nationalId){ toast('الاسم ورقم الهوية/الإقامة مطلوبان'); return; }
  let drivers = dget(DBK.drivers, []);
  const dup = drivers.find(d=>d.nationalId===nationalId && d.id!==id);
  if(dup){ toast('رقم الهوية/الإقامة مسجل مسبقًا لمندوب آخر'); return; }
  const data = {
    name, nationalId,
    nationality: document.getElementById('f_nationality').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    birthDate: document.getElementById('f_birthDate').value,
    contactInfo: document.getElementById('f_contactInfo').value.trim(),
    hireDate: document.getElementById('f_hireDate').value,
    status: document.getElementById('f_dstatus').value,
    jobTitle: document.getElementById('f_jobTitle').value.trim(),
    branch: document.getElementById('f_branch').value.trim(),
    supervisor: document.getElementById('f_dsupervisor').value,
    licenseNo: document.getElementById('f_licenseNo').value.trim(),
    licenseExpiry: document.getElementById('f_licenseExpiry').value,
    notes: document.getElementById('f_dnotes').value.trim(),
  };
  if(id){
    const idx = drivers.findIndex(d=>d.id===id);
    const oldStatus = drivers[idx].status;
    drivers[idx] = {...drivers[idx], ...data};
    dset(DBK.drivers, drivers);
    if(oldStatus !== data.status){
      pushDriverEvent(id, 'تغيير حالة', `تغيرت حالة المندوب من "${oldStatus}" إلى "${data.status}" (عبر تعديل البيانات)`);
    }
    logAudit('تعديل مندوب','إدارة المناديب', `تعديل بيانات المندوب "${name}"`);
    closeModal('driverModalBg');
    if(location.hash.includes('driver/'+id)) pageDriverDetail(id); else pageDrivers();
  } else {
    const nd = {id:uid('drv'), ...data, vehicleId:null, createdAt:new Date().toISOString()};
    drivers.push(nd);
    dset(DBK.drivers, drivers);
    pushDriverEvent(nd.id, 'إنشاء', `تم إنشاء ملف المندوب بحالة "${data.status}"`);
    logAudit('إضافة مندوب','إدارة المناديب', `تمت إضافة مندوب جديد "${name}"`);
    closeModal('driverModalBg');
    pageDrivers();
  }
  toast('تم الحفظ بنجاح');
}

function applyDriverStatusChange(id, status, note){
  const drivers = dget(DBK.drivers, []);
  const idx = drivers.findIndex(x=>x.id===id);
  if(idx<0) return;
  const old = drivers[idx].status;
  if(old === status) return;
  drivers[idx].status = status;
  dset(DBK.drivers, drivers);
  pushDriverEvent(id, 'تغيير حالة', `تغيرت حالة المندوب من "${old}" إلى "${status}"${note?' — '+note:''}`);
  logAudit('تغيير حالة مندوب','إدارة المناديب', `${drivers[idx].name}: ${old} → ${status}`);
}

/* ======================= TASKS ======================= */
function taskStatusColor(status){
  const map = {'جديدة':'var(--blue)','مسندة':'var(--steel-600)','قيد التنفيذ':'var(--amber)','مكتملة':'var(--green)','متأخرة':'var(--red)','ملغاة':'var(--text-600)'};
  return map[status] || 'var(--gray)';
}
function priorityColor(p){
  const map = {'منخفضة':{c:'var(--green)',bg:'var(--green-bg)'}, 'متوسطة':{c:'var(--blue)',bg:'var(--blue-bg)'}, 'عالية':{c:'var(--amber)',bg:'var(--amber-bg)'}, 'عاجلة':{c:'var(--red)',bg:'var(--red-bg)'}};
  return map[p] || {c:'var(--gray)',bg:'var(--gray-bg)'};
}
function isTaskOverdue(t){
  return t.dueDate && new Date(t.dueDate) < new Date() && !['مكتملة','ملغاة'].includes(t.status);
}
function refreshOverdueTasks(){
  const tasks = dget(DBK.tasks, []);
  let changed = false;
  tasks.forEach(t=>{
    if(isTaskOverdue(t) && t.status!=='متأخرة'){
      t.status = 'متأخرة'; changed = true;
      if(t.vehicleId) pushVehicleEvent(t.vehicleId, 'تأخر مهمة', `تجاوزت المهمة "${t.title}" الموعد المحدد`);
      if(t.driverId) pushDriverEvent(t.driverId, 'تأخر مهمة', `تجاوزت المهمة "${t.title}" الموعد المحدد`);
    }
  });
  if(changed) dset(DBK.tasks, tasks);
}
let taskFilter = {q:'', status:'', priority:''};
function pageTasks(){
  refreshOverdueTasks();
  const TASK_STATUSES = ['جديدة','مسندة','قيد التنفيذ','مكتملة','متأخرة','ملغاة'];
  const TASK_PRIORITIES = ['منخفضة','متوسطة','عالية','عاجلة'];
  document.getElementById('content').innerHTML = `
    <div class="page-head">
      <div><h2>المهام</h2><p>إنشاء وإسناد ومتابعة جميع المهام التشغيلية المرتبطة بالسيارات والمناديب</p></div>
      ${can('tasks','add')? `<button class="btn btn-gold" onclick="openTaskModal()">+ مهمة جديدة</button>` : ''}
    </div>
    <div class="panel">
      <div class="toolbar">
        <input id="tFilterQ" placeholder="بحث بعنوان المهمة أو اسم المندوب..." value="${taskFilter.q}" oninput="taskFilter.q=this.value; renderTaskTable();">
        <select onchange="taskFilter.status=this.value; renderTaskTable();">
          <option value="">كل الحالات</option>
          ${TASK_STATUSES.map(s=>`<option value="${s}" ${taskFilter.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select onchange="taskFilter.priority=this.value; renderTaskTable();">
          <option value="">كل الأولويات</option>
          ${TASK_PRIORITIES.map(s=>`<option value="${s}" ${taskFilter.priority===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>رقم</th><th>العنوان</th><th>المندوب</th><th>السيارة</th><th>الأولوية</th><th>الحالة</th><th>موعد التنفيذ</th><th></th></tr></thead>
        <tbody id="taskTbody"></tbody>
      </table>
      </div>
    </div>`;
  renderTaskTable();
}
function renderTaskTable(){
  const tasks = dget(DBK.tasks, []);
  const drivers = dget(DBK.drivers, []);
  const vehicles = dget(DBK.vehicles, []);
  let list = tasks.slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  if(taskFilter.status) list = list.filter(t=>t.status===taskFilter.status);
  if(taskFilter.priority) list = list.filter(t=>t.priority===taskFilter.priority);
  if(taskFilter.q){
    const q = taskFilter.q.trim();
    const matchDriver = drivers.filter(d=>d.name.includes(q)).map(d=>d.id);
    list = list.filter(t=> (t.title||'').includes(q) || matchDriver.includes(t.driverId));
  }
  const tbody = document.getElementById('taskTbody');
  if(!tbody) return;
  if(!list.length){
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="ic">📋</div><h4>لا توجد مهام مطابقة</h4><p>أضف مهمة جديدة أو عدّل معايير البحث</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(t=>{
    const drv = drivers.find(d=>d.id===t.driverId);
    const veh = vehicles.find(v=>v.id===t.vehicleId);
    const pc = priorityColor(t.priority);
    return `<tr>
      <td>${t.taskNo||'-'}</td>
      <td><b>${t.title}</b><br><span style="color:var(--text-400); font-size:11.5px;">${t.type||''}</span></td>
      <td>${drv? drv.name : '-'}</td>
      <td>${veh? (veh.plate||veh.internalNo) : '-'}</td>
      <td><span class="priority-pill" style="background:${pc.bg}; color:${pc.c}">${t.priority||'-'}</span></td>
      <td><span class="status-dot" style="background:${taskStatusColor(t.status)}"></span>${t.status}</td>
      <td>${t.dueDate? fmtDateTime(t.dueDate) : '-'}</td>
      <td>
        <div class="row-actions">
          ${t.status!=='مكتملة' && t.status!=='ملغاة' ? `<div class="icon-link" title="إكمال" onclick="quickSetTaskStatus('${t.id}','مكتملة')">✔</div>` : ''}
          <div class="icon-link" title="تعديل" onclick="openTaskModal('${t.id}')">✎</div>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function openTaskModalPrefilled(prefill){ openTaskModal(null, prefill); }
function saveTask(id){
  const title = document.getElementById('f_title').value.trim();
  if(!title){ toast('عنوان المهمة مطلوب'); return; }
  let tasks = dget(DBK.tasks, []);
  const data = {
    title,
    type: document.getElementById('f_type').value,
    priority: document.getElementById('f_priority').value,
    driverId: document.getElementById('f_taskDriver').value || null,
    vehicleId: document.getElementById('f_taskVehicle').value || null,
    supervisor: document.getElementById('f_taskSupervisor').value,
    dueDate: document.getElementById('f_dueDate').value,
    description: document.getElementById('f_description').value.trim(),
    notes: document.getElementById('f_taskNotes').value.trim(),
  };
  if(id){
    const idx = tasks.findIndex(x=>x.id===id);
    const oldStatus = tasks[idx].status;
    const newStatus = document.getElementById('f_taskStatus').value;
    tasks[idx] = {...tasks[idx], ...data, status:newStatus};
    dset(DBK.tasks, tasks);
    if(oldStatus !== newStatus){
      if(data.vehicleId) pushVehicleEvent(data.vehicleId, 'تحديث مهمة', `تغيرت حالة المهمة "${title}" من "${oldStatus}" إلى "${newStatus}"`);
      if(data.driverId) pushDriverEvent(data.driverId, 'تحديث مهمة', `تغيرت حالة المهمة "${title}" من "${oldStatus}" إلى "${newStatus}"`);
    }
    logAudit('تعديل مهمة','المهام', `تعديل المهمة "${title}"`);
  } else {
    const taskNo = String(tasks.length+1).padStart(4,'0');
    const status = data.driverId ? 'مسندة' : 'جديدة';
    const nt = {id:uid('task'), taskNo, ...data, status, createdAt:new Date().toISOString()};
    tasks.push(nt);
    dset(DBK.tasks, tasks);
    if(data.vehicleId) pushVehicleEvent(data.vehicleId, 'مهمة جديدة', `تم إنشاء مهمة "${title}"${data.dueDate?' — الموعد: '+fmtDateTime(data.dueDate):''}`);
    if(data.driverId) pushDriverEvent(data.driverId, 'مهمة جديدة', `تم إسناد مهمة "${title}"${data.dueDate?' — الموعد: '+fmtDateTime(data.dueDate):''}`);
    logAudit('إضافة مهمة','المهام', `تمت إضافة مهمة جديدة "${title}" (رقم ${taskNo})`);
  }
  closeModal('taskModalBg');
  if(location.hash==='#/tasks') pageTasks();
  else if(location.hash.startsWith('#/vehicle/')) pageVehicleDetail(location.hash.split('/')[2]);
  else if(location.hash.startsWith('#/driver/')) pageDriverDetail(location.hash.split('/')[2]);
  toast('تم حفظ المهمة');
}
function quickSetTaskStatus(id, status){
  const tasks = dget(DBK.tasks, []);
  const idx = tasks.findIndex(x=>x.id===id);
  if(idx<0) return;
  const old = tasks[idx].status;
  tasks[idx].status = status;
  dset(DBK.tasks, tasks);
  const t = tasks[idx];
  if(t.vehicleId) pushVehicleEvent(t.vehicleId, 'تحديث مهمة', `تغيرت حالة المهمة "${t.title}" من "${old}" إلى "${status}"`);
  if(t.driverId) pushDriverEvent(t.driverId, 'تحديث مهمة', `تغيرت حالة المهمة "${t.title}" من "${old}" إلى "${status}"`);
  logAudit('تحديث حالة مهمة','المهام', `${t.title}: ${old} → ${status}`);
  if(location.hash==='#/tasks') renderTaskTable();
  else if(location.hash.startsWith('#/vehicle/')) pageVehicleDetail(location.hash.split('/')[2]);
  else if(location.hash.startsWith('#/driver/')) pageDriverDetail(location.hash.split('/')[2]);
  toast('تم تحديث حالة المهمة');
}
function renderMiniTaskTable(list, opts){
  if(!list.length) return `<div class="placeholder-note">لا توجد مهام مرتبطة بعد</div>`;
  return `<div style="overflow-x:auto;"><table class="mini-table">
    <thead><tr><th>رقم</th><th>العنوان</th><th>الأولوية</th><th>الحالة</th><th>الموعد</th><th></th></tr></thead>
    <tbody>${list.map(t=>{
      const pc = priorityColor(t.priority);
      return `<tr>

function saveAccident(id){
  const vehicleId = document.getElementById('f_accVehicle').value;
  if(!vehicleId){ toast('الرجاء اختيار السيارة'); return; }
  let accidents = dget(DBK.accidents, []);
  const data = {
    vehicleId,
    driverId: document.getElementById('f_accDriver').value || null,
    type: document.getElementById('f_accType').value,
    damageLevel: document.getElementById('f_damageLevel').value,
    date: document.getElementById('f_accDate').value,
    location: document.getElementById('f_accLocation').value.trim(),
    description: document.getElementById('f_accDescription').value.trim(),
    vehicleOperational: document.getElementById('f_vehOperational').classList.contains('on'),
    needsMaintenance: document.getElementById('f_needsMaint').classList.contains('on'),
    estimatedCost: document.getElementById('f_estCost').value,
    actualCost: document.getElementById('f_actCost').value,
    insuranceCompany: document.getElementById('f_insCompany').value.trim(),
    insuranceClaimNo: document.getElementById('f_insClaimNo').value.trim(),
    notes: document.getElementById('f_accNotes').value.trim(),
  };
  const vehicles = dget(DBK.vehicles, []);
  const v = vehicles.find(x=>x.id===vehicleId);
  if(id){
    const idx = accidents.findIndex(x=>x.id===id);
    const oldStatus = accidents[idx].status;
    const newStatus = document.getElementById('f_accStatus').value;
    accidents[idx] = {...accidents[idx], ...data, status:newStatus};
    dset(DBK.accidents, accidents);
    if(oldStatus !== newStatus){
      pushVehicleEvent(vehicleId, 'تحديث حادث', `تغيرت حالة الحادث ${accidents[idx].accidentNo} من "${oldStatus}" إلى "${newStatus}"`);
      if(data.driverId) pushDriverEvent(data.driverId, 'تحديث حادث', `تغيرت حالة الحادث ${accidents[idx].accidentNo} من "${oldStatus}" إلى "${newStatus}"`);
      if((newStatus==='تم الإصلاح' || newStatus==='مغلق') && v && v.status==='حادث'){
        applyVehicleStatusChange(vehicleId, 'تعمل', `تم إغلاق/إصلاح الحادث ${accidents[idx].accidentNo}`);
      }
    }
    logAudit('تعديل حادث','الحوادث', `تعديل بيانات الحادث ${accidents[idx].accidentNo}`);
  } else {
    const accidentNo = 'ACC-'+String(accidents.length+1).padStart(4,'0');
    const na = {id:uid('acc'), accidentNo, ...data, status:'مفتوح', createdAt:new Date().toISOString()};
    accidents.push(na);
    dset(DBK.accidents, accidents);
    pushVehicleEvent(vehicleId, 'حادث', `تم تسجيل حادث (${accidentNo}) — الضرر: ${data.damageLevel}${data.description?' — '+data.description:''}`);
    if(data.driverId) pushDriverEvent(data.driverId, 'حادث', `تم تسجيل حادث (${accidentNo}) على السيارة ${v?(v.plate||v.internalNo):''}`);
    const autoSet = document.getElementById('f_autoSetStatus');
    if(autoSet && autoSet.classList.contains('on') && v && v.status!=='حادث'){
      applyVehicleStatusChange(vehicleId, 'حادث', `تسجيل الحادث ${accidentNo}`);
    }
    logAudit('تسجيل حادث','الحوادث', `تم تسجيل حادث جديد (${accidentNo})`);
  }
  closeModal('accidentModalBg');
  if(location.hash==='#/accidents') pageAccidents();
  else if(location.hash.startsWith('#/vehicle/')) pageVehicleDetail(location.hash.split('/')[2]);
  else if(location.hash.startsWith('#/driver/')) pageDriverDetail(location.hash.split('/')[2]);
  toast('تم حفظ بيانات الحادث');
}

function saveMaintenance(id){
  const vehicleId = document.getElementById('f_mVehicle').value;
  if(!vehicleId){ toast('الرجاء اختيار السيارة'); return; }
  let list = dget(DBK.maintenance, []);
  const data = {
    vehicleId,
    type: document.getElementById('f_mType').value,
    date: document.getElementById('f_mDate').value,
    odometer: document.getElementById('f_mOdometer').value,
    workshop: document.getElementById('f_mWorkshop').value.trim(),
    cost: document.getElementById('f_mCost').value,
    invoiceNo: document.getElementById('f_mInvoice').value.trim(),
    nextDueDate: document.getElementById('f_mNextDue').value,
    notes: document.getElementById('f_mNotes').value.trim(),
  };
  const vehicles = dget(DBK.vehicles, []);
  const vIdx = vehicles.findIndex(v=>v.id===vehicleId);
  if(id){
    const idx = list.findIndex(x=>x.id===id);
    list[idx] = {...list[idx], ...data};
    dset(DBK.maintenance, list);
    logAudit('تعديل صيانة','الصيانة', `تعديل سجل الصيانة ${list[idx].maintenanceNo}`);
  } else {
    const maintenanceNo = 'MNT-'+String(list.length+1).padStart(4,'0');
    const nm = {id:uid('mnt'), maintenanceNo, ...data, createdAt:new Date().toISOString()};
    list.push(nm);
    dset(DBK.maintenance, list);
    if(vIdx>=0){
      vehicles[vIdx].lastMaintenance = data.date;
      if(data.nextDueDate) vehicles[vIdx].nextMaintenance = data.nextDueDate;
      dset(DBK.vehicles, vehicles);
    }
    pushVehicleEvent(vehicleId, 'صيانة', `تم تسجيل صيانة (${maintenanceNo}) — ${data.type}${data.cost?' — التكلفة: '+data.cost:''}`);
    logAudit('تسجيل صيانة','الصيانة', `تم تسجيل صيانة جديدة (${maintenanceNo})`);
    const autoRestore = document.getElementById('f_mAutoRestore');
    if(autoRestore && autoRestore.classList.contains('on') && vIdx>=0 && vehicles[vIdx].status==='في الصيانة'){
      applyVehicleStatusChange(vehicleId, 'تعمل', `اكتملت الصيانة ${maintenanceNo}`);
    }
  }
  closeModal('maintModalBg');
  if(location.hash==='#/maintenance') pageMaintenance();
  else if(location.hash.startsWith('#/vehicle/')) pageVehicleDetail(location.hash.split('/')[2]);
  toast('تم حفظ سجل الصيانة');
}

function saveLoan(id){
  const driverId = document.getElementById('f_lnDriver').value;
  const amount = parseFloat(document.getElementById('f_lnAmount').value)||0;
  if(!driverId || !amount){ toast('المندوب والمبلغ مطلوبان'); return; }
  let loans = dget(DBK.loans, []);
  const drivers = dget(DBK.drivers, []);
  const d = drivers.find(x=>x.id===driverId);
  const paidAmount = parseFloat(document.getElementById('f_lnPaid').value)||0;
  const data = {
    driverId, amount,
    date: document.getElementById('f_lnDate').value,
    reason: document.getElementById('f_lnReason').value.trim(),
    installmentsCount: document.getElementById('f_lnInstCount').value,
    installmentValue: document.getElementById('f_lnInstValue').value,
    paidAmount,
    remainingAmount: Math.max(amount - paidAmount, 0),
    firstInstallmentDate: document.getElementById('f_lnFirstInst').value,
    notes: document.getElementById('f_lnNotes').value.trim(),
  };
  if(id){
    const idx = loans.findIndex(x=>x.id===id);
    const oldStatus = loans[idx].status;
    let newStatus = document.getElementById('f_lnStatus').value;
    if(data.remainingAmount<=0 && newStatus==='قيد السداد') newStatus='مكتمل السداد';
    loans[idx] = {...loans[idx], ...data, status:newStatus};
    dset(DBK.loans, loans);
    if(oldStatus!==newStatus) pushDriverEvent(driverId, 'تحديث سلفة', `تغيرت حالة السلفة ${loans[idx].loanNo} من "${oldStatus}" إلى "${newStatus}"`);
    logAudit('تعديل سلفة','السلف', `تعديل السلفة ${loans[idx].loanNo}`);
  } else {
    const loanNo = 'LN-'+String(loans.length+1).padStart(4,'0');
    const nl = {id:uid('loan'), loanNo, ...data, status:'بانتظار الموافقة', createdAt:new Date().toISOString()};
    loans.push(nl);
    dset(DBK.loans, loans);
    pushDriverEvent(driverId, 'طلب سلفة', `تم تقديم طلب سلفة (${loanNo}) بمبلغ ${amount} ريال`);
    logAudit('طلب سلفة','السلف', `طلب سلفة جديد (${loanNo}) للمندوب "${d?d.name:''}"`);
  }
  closeModal('loanModalBg');
  if(location.hash==='#/loans') pageLoans();
  else if(location.hash.startsWith('#/driver/')) pageDriverDetail(location.hash.split('/')[2]);
  toast('تم حفظ السلفة');
}
function approveLoan(id){
  const loans = dget(DBK.loans, []);
  const idx = loans.findIndex(x=>x.id===id);
  loans[idx].status = 'معتمد';
  loans[idx].approvedBy = (currentUser()||{}).name;
  loans[idx].approvalDate = new Date().toISOString();
  dset(DBK.loans, loans);
  pushDriverEvent(loans[idx].driverId, 'اعتماد سلفة', `تم اعتماد السلفة ${loans[idx].loanNo}`);
  logAudit('اعتماد سلفة','السلف', `تم اعتماد السلفة ${loans[idx].loanNo}`);
  refreshCurrentListView(); toast('تم الاعتماد');
}
function rejectLoan(id){
  const loans = dget(DBK.loans, []);
  const idx = loans.findIndex(x=>x.id===id);
  loans[idx].status = 'مرفوض';
  dset(DBK.loans, loans);
  pushDriverEvent(loans[idx].driverId, 'رفض سلفة', `تم رفض طلب السلفة ${loans[idx].loanNo}`);
  logAudit('رفض سلفة','السلف', `تم رفض السلفة ${loans[idx].loanNo}`);
  refreshCurrentListView(); toast('تم الرفض');
}
function disburseLoan(id){
  const loans = dget(DBK.loans, []);
  const idx = loans.findIndex(x=>x.id===id);
  loans[idx].status = 'قيد السداد';
  loans[idx].remainingAmount = loans[idx].amount - (loans[idx].paidAmount||0);
  dset(DBK.loans, loans);
  pushDriverEvent(loans[idx].driverId, 'صرف سلفة', `تم صرف السلفة ${loans[idx].loanNo}`);
  logAudit('صرف سلفة','السلف', `تم صرف السلفة ${loans[idx].loanNo}`);
  refreshCurrentListView(); toast('تم تسجيل الصرف');
}
function refreshCurrentListView(){
  const h = location.hash;
  if(h==='#/loans') renderLoanTable();
  else if(h==='#/claims') renderClaimTable();
  else if(h==='#/deductions') renderDeductionTable();
  else if(h==='#/leaves') renderLeaveTable();
  else if(h==='#/requests') renderRequestTable();
  else if(h.startsWith('#/driver/')) pageDriverDetail(h.split('/')[2]);
  else if(h.startsWith('#/vehicle/')) pageVehicleDetail(h.split('/')[2]);
  else if(h==='#/dashboard' || h==='') pageDashboard();
}

function saveClaim(id){
  const driverId = document.getElementById('f_clDriver').value;
  const amount = parseFloat(document.getElementById('f_clAmount').value)||0;
  if(!driverId || !amount){ toast('المندوب والمبلغ مطلوبان'); return; }
  let claims = dget(DBK.claims, []);
  const drivers = dget(DBK.drivers, []);
  const d = drivers.find(x=>x.id===driverId);
  const data = {
    driverId, amount,
    type: document.getElementById('f_clType').value,
    date: document.getElementById('f_clDate').value,
    reason: document.getElementById('f_clReason').value.trim(),
    notes: document.getElementById('f_clNotes').value.trim(),
  };
  if(id){
    const idx = claims.findIndex(x=>x.id===id);
    const oldStatus = claims[idx].status;
    const newStatus = document.getElementById('f_clStatus').value;
    claims[idx] = {...claims[idx], ...data, status:newStatus};
    dset(DBK.claims, claims);
    if(oldStatus!==newStatus) pushDriverEvent(driverId, 'تحديث مطالبة', `تغيرت حالة المطالبة ${claims[idx].claimNo} من "${oldStatus}" إلى "${newStatus}"`);
    logAudit('تعديل مطالبة','المطالبات', `تعديل المطالبة ${claims[idx].claimNo}`);
  } else {
    const claimNo = 'CLM-'+String(claims.length+1).padStart(4,'0');
    const nc = {id:uid('clm'), claimNo, ...data, status:'بانتظار الموافقة', requestedBy:(currentUser()||{}).name, createdAt:new Date().toISOString()};
    claims.push(nc);
    dset(DBK.claims, claims);
    pushDriverEvent(driverId, 'طلب مطالبة', `تم تقديم مطالبة مالية (${claimNo}) بمبلغ ${amount} ريال`);
    logAudit('طلب مطالبة','المطالبات', `طلب مطالبة جديد (${claimNo}) للمندوب "${d?d.name:''}"`);
  }
  closeModal('claimModalBg');
  if(location.hash==='#/claims') pageClaims();

function refreshExpiredLeaves(){
  const leaves = dget(DBK.leaves, []);
  const drivers = dget(DBK.drivers, []);
  const now = new Date(); let changed=false;
  leaves.forEach(lv=>{
    if(lv.status==='معتمدة' && lv.endDate && new Date(lv.endDate) < now){
      lv.status='منتهية'; changed=true;
      const d = drivers.find(x=>x.id===lv.driverId);
      if(d && d.status==='إجازة'){ applyDriverStatusChange(d.id, 'على رأس العمل', `انتهاء الإجازة ${lv.leaveNo}`); }
      pushDriverEvent(lv.driverId, 'انتهاء إجازة', `انتهت الإجازة ${lv.leaveNo}`);
    }
  });
  if(changed) dset(DBK.leaves, leaves);
}

function saveRequest(id){
  const driverId = document.getElementById('f_rqDriver').value;
  if(!driverId){ toast('الرجاء اختيار المندوب'); return; }
  let list = dget(DBK.requests, []);
  const drivers = dget(DBK.drivers, []);
  const d = drivers.find(x=>x.id===driverId);
  const data = {
    driverId,
    type: document.getElementById('f_rqType').value,
    date: document.getElementById('f_rqDate').value,
    details: document.getElementById('f_rqDetails').value.trim(),
    notes: document.getElementById('f_rqNotes').value.trim(),
  };
  if(id){
    const idx = list.findIndex(x=>x.id===id);
    list[idx] = {...list[idx], ...data};
    dset(DBK.requests, list);
    logAudit('تعديل طلب إداري','الطلبات الإدارية', `تعديل الطلب ${list[idx].requestNo}`);
  } else {
    const requestNo = 'REQ-'+String(list.length+1).padStart(4,'0');
    const nr = {id:uid('req'), requestNo, ...data, status:'بانتظار الموافقة', createdAt:new Date().toISOString()};
    list.push(nr);
    dset(DBK.requests, list);
    pushDriverEvent(driverId, 'طلب إداري', `تم تقديم طلب إداري (${requestNo}) — ${data.type}`);
    logAudit('طلب إداري','الطلبات الإدارية', `طلب إداري جديد (${requestNo}) للمندوب "${d?d.name:''}"`);
  }
  closeModal('requestModalBg');
  if(location.hash==='#/requests') pageRequests();
  else if(location.hash.startsWith('#/driver/')) pageDriverDetail(location.hash.split('/')[2]);
  toast('تم حفظ الطلب');
}
function approveRequest(id){

/* ======================= NOTIFICATIONS (bell) ======================= */
function collectNotifications(){
  refreshOverdueTasks(); refreshExpiredLeaves();
  const items = [];
  const vehicles = dget(DBK.vehicles, []), drivers = dget(DBK.drivers, []);
  const tasks = dget(DBK.tasks, []), accidents = dget(DBK.accidents, []);
  const loans = dget(DBK.loans, []), claims = dget(DBK.claims, []);
  const leaves = dget(DBK.leaves, []), requests = dget(DBK.requests, []);
  const now = new Date(), in30 = new Date(now.getTime()+30*24*60*60*1000);
  const isSoon = (d)=> d && new Date(d)>=now && new Date(d)<=in30;

  tasks.filter(t=>t.status==='متأخرة').forEach(t=> items.push({icon:'⏰', text:`مهمة متأخرة: ${t.title}`, hash:'#/tasks'}));
  tasks.filter(t=> (t.status==='جديدة'||t.status==='مسندة') && t.createdAt && (Date.now()-new Date(t.createdAt).getTime()) < 3*24*60*60*1000)
    .forEach(t=> items.push({icon:'📋', text:`مهمة جديدة مسندة: ${t.title}`, hash:'#/tasks'}));
  accidents.filter(a=>a.status!=='مغلق').forEach(a=> items.push({icon:'⚠️', text:`حادث مفتوح: ${a.accidentNo}`, hash:'#/accidents'}));
  loans.filter(l=>l.status==='بانتظار الموافقة').forEach(l=> items.push({icon:'💳', text:`سلفة بانتظار الاعتماد: ${l.loanNo}`, hash:'#/loans'}));
  claims.filter(c=>c.status==='بانتظار الموافقة').forEach(c=> items.push({icon:'🧾', text:`مطالبة بانتظار الاعتماد: ${c.claimNo}`, hash:'#/claims'}));
  leaves.filter(l=>l.status==='بانتظار الموافقة').forEach(l=> items.push({icon:'🗓️', text:`طلب إجازة بانتظار الاعتماد: ${l.leaveNo}`, hash:'#/leaves'}));
  requests.filter(r=>r.status==='بانتظار الموافقة').forEach(r=> items.push({icon:'📨', text:`طلب إداري بانتظار الاعتماد: ${r.requestNo}`, hash:'#/requests'}));
  vehicles.forEach(v=>{
    if(isSoon(v.insuranceExpiry)) items.push({icon:'📄', text:`تأمين ${v.plate||v.internalNo} ينتهي قريبًا`, hash:'#/vehicle/'+v.id});
    if(isSoon(v.registrationExpiry)) items.push({icon:'📄', text:`استمارة ${v.plate||v.internalNo} تنتهي قريبًا`, hash:'#/vehicle/'+v.id});
    if(isSoon(v.inspectionExpiry)) items.push({icon:'📄', text:`الفحص الدوري لـ ${v.plate||v.internalNo} ينتهي قريبًا`, hash:'#/vehicle/'+v.id});
    if(isSoon(v.nextMaintenance)) items.push({icon:'🔧', text:`صيانة ${v.plate||v.internalNo} مستحقة قريبًا`, hash:'#/vehicle/'+v.id});
  });
  drivers.forEach(d=>{ if(isSoon(d.licenseExpiry)) items.push({icon:'🪪', text:`رخصة ${d.name} تنتهي قريبًا`, hash:'#/driver/'+d.id}); });
  return items;
}
function renderNotifBell(){
  const items = collectNotifications();
  const pip = document.getElementById('notifPip');
  if(!pip) return;
  if(items.length){ pip.style.display='flex'; pip.textContent = items.length>99?'99+':items.length; }
  else pip.style.display='none';
}
function checkNewNotificationsTone(){
  const u = currentUser(); if(!u) return;
  const items = collectNotifications();
  const currentKeys = items.map(it=> it.icon+'|'+it.text).sort();
  const key = 'taj_last_notif_'+u.id;
  let lastKnown = [];
  try{ lastKnown = JSON.parse(sessionStorage.getItem(key)||'[]'); }catch(e){}
  const isNew = currentKeys.some(k=>!lastKnown.includes(k));
  if(isNew && lastKnown.length>0){ playNotificationTone(); }
  sessionStorage.setItem(key, JSON.stringify(currentKeys));
}
function toggleNotifPanel(){
  const panel = document.getElementById('notifPanel');
  if(!panel) return;
  if(panel.style.display==='block'){ panel.style.display='none'; return; }
  const items = collectNotifications();
  panel.innerHTML = `
    <div style="padding:14px 16px; border-bottom:1px solid var(--line); font-weight:700; color:var(--navy-900); display:flex; justify-content:space-between; align-items:center;">
      التنبيهات (${items.length}) <button class="modal-close" onclick="toggleNotifPanel()">✕</button>
    </div>
    ${items.length? items.map(it=>`
      <div style="padding:12px 16px; border-bottom:1px solid var(--line); font-size:13px; cursor:pointer; display:flex; gap:10px;" onclick="location.hash='${it.hash}'; toggleNotifPanel();">
        <span>${it.icon}</span><span>${it.text}</span>
      </div>`).join('') : `<div style="padding:26px; text-align:center; color:var(--text-400); font-size:13px;">لا توجد تنبيهات حاليًا 🎉</div>`}
  `;
  panel.style.display='block';
}

function ensureXLSX(cb){
  if(window.XLSX){ cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload = cb;
  s.onerror = ()=> toast('تعذر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت');
  document.head.appendChild(s);
}
function exportSheet(filename, sheets){
  ensureXLSX(()=>{
    const wb = XLSX.utils.book_new();
    Object.keys(sheets).forEach(name=>{
      const ws = XLSX.utils.json_to_sheet(sheets[name]);
      XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
    });
    XLSX.writeFile(wb, filename);
    toast('تم تصدير الملف');
  });
}

    const settingsWs = XLSX.utils.json_to_sheet([{ json: JSON.stringify(dget(DBK.settings, {})) }]);
    XLSX.utils.book_append_sheet(wb, settingsWs, 'الإعدادات');

    toast('تم تصدير النسخة الاحتياطية الكاملة — احتفظ بهذا الملف لاستعادة البيانات لاحقًا عند الحاجة');

}

function importFullBackupExcel(file){
  ensureXLSX(()=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        if(!confirm('سيتم استبدال كل البيانات الحالية بمحتوى هذا الملف بالكامل. هل أنت متأكد من الاستعادة؟')) return;
        Object.keys(BACKUP_SHEETS).forEach(sheetName=>{
          if(wb.SheetNames.includes(sheetName)){
            const ws = wb.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
            const clean = rows.filter(r=> !('__فارغ' in r));
            dset(BACKUP_SHEETS[sheetName], clean);
          }
        });
        if(wb.SheetNames.includes('الإعدادات')){
          const rows = XLSX.utils.sheet_to_json(wb.Sheets['الإعدادات']);
          if(rows[0] && rows[0].json){
            try{ dset(DBK.settings, JSON.parse(rows[0].json)); }catch(err){ console.warn('settings parse failed', err); }
          }
        }
        logAudit('استعادة نسخة احتياطية','التقارير','تم استيراد نسخة احتياطية كاملة من ملف Excel');
        toast('تم استعادة البيانات بنجاح');
        route();
      }catch(err){
        toast('تعذر قراءة الملف: '+err.message, 6000);
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

/* ======================= PRINT / PDF ======================= */
function genericPrint(title, bodyHtml){
  const w = window.open('', '_blank');
  if(!w){ toast('الرجاء السماح بالنوافذ المنبثقة للطباعة'); return; }
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>${title}</title>
  <style>
    body{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif; padding:30px; color:#152233;}
    h1{font-size:19px; border-bottom:2px solid #B8842A; padding-bottom:10px;}
    table{width:100%; border-collapse:collapse; margin-top:14px;}
    th,td{border:1px solid #ccc; padding:8px 10px; font-size:12.5px; text-align:right;}
    th{background:#f4f6f8;}
    .meta{color:#666; font-size:12px; margin-bottom:16px;}
  </style></head><body>
  <h1>${title}</h1>
  <div class="meta">تاريخ الطباعة: ${new Date().toLocaleString('ar-SA-u-nu-latn')}</div>
  ${bodyHtml}
  </body></html>`);
  w.document.close();
  setTimeout(()=> w.print(), 350);
}

  leaves.push({id:uid('lv'), leaveNo:'LV-'+String(leaves.length+1).padStart(4,'0'), driverId:newDriverIds[2], type:'سنوية', startDate:new Date().toISOString().slice(0,10), endDate:'', status:'بانتظار الموافقة', isDemo:true, createdAt:now});
  dset(DBK.leaves, leaves);
  logAudit('توليد بيانات تجريبية','النظام', 'تم توليد بيانات تجريبية كاملة للتجربة');
  toast('تم توليد البيانات التجريبية بنجاح');
  route();
}
function deleteDemoData(){
  if(!confirm('هل تريد حذف جميع البيانات التجريبية نهائيًا؟ لن يتأثر أي من بياناتك الحقيقية.')) return;
  const demoVehicleIds = dget(DBK.vehicles, []).filter(v=>v.isDemo).map(v=>v.id);
  const demoDriverIds = dget(DBK.drivers, []).filter(d=>d.isDemo).map(d=>d.id);
  [DBK.vehicles, DBK.drivers, DBK.tasks, DBK.accidents, DBK.violations, DBK.maintenance, DBK.loans, DBK.claims, DBK.deductions, DBK.leaves, DBK.requests].forEach(k=>{
    dset(k, dget(k, []).filter(x=>!x.isDemo));
  });
  dset(DBK.vehicleEvents, dget(DBK.vehicleEvents, []).filter(e=>!demoVehicleIds.includes(e.entityId)));
  dset(DBK.driverEvents, dget(DBK.driverEvents, []).filter(e=>!demoDriverIds.includes(e.entityId)));
  dset(DBK.assignments, dget(DBK.assignments, []).filter(a=>!demoVehicleIds.includes(a.vehicleId) && !demoDriverIds.includes(a.driverId)));
  logAudit('حذف بيانات تجريبية','النظام', 'تم حذف جميع البيانات التجريبية');
  toast('تم حذف البيانات التجريبية');
  route();
}

/* ======================= INTERNAL MESSAGES (صندوق المراسلات) ======================= */
function playNotificationTone(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const notes = [{f:783.99, t:0, g:0.15}, {f:1046.50, t:0.11, g:0.17}];
    notes.forEach(n=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = n.f;
      const start = ctx.currentTime + n.t;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(n.g, start+0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.45);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start+0.5);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 900);
  }catch(e){}
}
function inboxFor(user){
  return dget(DBK.messages, []).filter(m=> m.toRole===user.role || m.toRole==='all');
}
function checkNewMessagesTone(){
  const u = currentUser(); if(!u) return;
  const inbox = inboxFor(u);
  const unreadIds = inbox.filter(m=>!m.readBy.includes(u.id)).map(m=>m.id).sort();
  const key = 'taj_last_unread_'+u.id;
  let lastKnown = [];
  try{ lastKnown = JSON.parse(sessionStorage.getItem(key)||'[]'); }catch(e){}
  const isNew = unreadIds.some(id=>!lastKnown.includes(id));
  if(isNew && lastKnown.length>0){ playNotificationTone(); }
  sessionStorage.setItem(key, JSON.stringify(unreadIds));
}
function renderMailBell(){
  const u = currentUser(); if(!u) return;
  const pip = document.getElementById('mailPip');
  if(!pip) return;
  const unread = inboxFor(u).filter(m=>!m.readBy.includes(u.id)).length;
  if(unread){ pip.style.display='flex'; pip.textContent = unread>99?'99+':unread; }
  else pip.style.display='none';
}
let messagesTab = 'inbox';
function pageMessages(){
  const u = currentUser();
  document.getElementById('content').innerHTML = `
    <div class="page-head">
      <div><h2>صندوق المراسلات</h2><p>تواصل رسمي وموثّق بين أقسام الشركة (الإدارة، التشغيل، المالية، الموارد البشرية)</p></div>
      <button class="btn btn-gold" onclick="openComposeModal()">✉️ رسالة جديدة</button>
    </div>
    <div class="tabs">
      <button class="tab-btn ${messagesTab==='inbox'?'active':''}" onclick="messagesTab='inbox'; pageMessages();">الوارد</button>
      <button class="tab-btn ${messagesTab==='sent'?'active':''}" onclick="messagesTab='sent'; pageMessages();">الصادر</button>
    </div>
    <div class="panel" style="padding:0;" id="msgListPanel"></div>
  `;
  renderMessagesList();
}
function renderMessagesList(){
  const u = currentUser();
  const all = dget(DBK.messages, []).slice().sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  const list = messagesTab==='inbox' ? all.filter(m=> m.toRole===u.role || m.toRole==='all') : all.filter(m=> m.fromUserId===u.id);
  const panel = document.getElementById('msgListPanel');
  if(!list.length){
    panel.innerHTML = `<div class="empty-state"><div class="ic">📬</div><h4>لا توجد رسائل</h4><p>${messagesTab==='inbox'?'لم تصلك أي رسائل بعد':'لم ترسل أي رسائل بعد'}</p></div>`;
    return;
  }
  panel.innerHTML = list.map(m=>{
    const isUnread = messagesTab==='inbox' && !m.readBy.includes(u.id);
    return `<div class="msg-item ${isUnread?'unread':'read'}" onclick="viewMessage('${m.id}')">
      <div class="msg-dot"></div>
      <div style="flex:1;">
        <div class="msg-subject">${m.subject || '(بدون عنوان)'}</div>
        <div class="msg-meta">
          ${messagesTab==='inbox' ? 'من: '+m.fromName+' ('+roleName(m.fromRole)+')' : 'إلى: '+(m.toRole==='all'?'جميع الأقسام':roleName(m.toRole))}
          &nbsp;·&nbsp; ${fmtDateTime(m.at)}
        </div>
      </div>
    </div>`;
  }).join('');
}
function viewMessage(id){
  const u = currentUser();
  const messages = dget(DBK.messages, []);
  const idx = messages.findIndex(m=>m.id===id);
  if(idx<0) return;
  const m = messages[idx];
  if(!m.readBy.includes(u.id)){ m.readBy.push(u.id); dset(DBK.messages, messages); renderMailBell(); }
  document.body.insertAdjacentHTML('beforeend', `
  <div class="modal-bg" id="msgViewBg">
    <div class="modal" style="max-width:560px;">
      <div class="modal-head"><h3>${m.subject||'(بدون عنوان)'}</h3><button class="modal-close" onclick="closeModal('msgViewBg')">✕</button></div>
      <div class="modal-body">
        <div class="msg-meta" style="margin-bottom:6px;">من: <b>${m.fromName}</b> (${roleName(m.fromRole)}) — إلى: <b>${m.toRole==='all'?'جميع الأقسام':roleName(m.toRole)}</b></div>
        <div class="msg-meta">${fmtDateTime(m.at)}</div>
        <div class="msg-body-view">${(m.body||'').replace(/</g,'&lt;')}</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal('msgViewBg')">إغلاق</button>
        <button class="btn btn-gold" onclick="closeModal('msgViewBg'); replyToMessage('${m.id}')">↩ رد</button>
      </div>
    </div>
  </div>`);
  renderMessagesList();
}
function replyToMessage(id){
  const m = dget(DBK.messages, []).find(x=>x.id===id);
  if(!m) return;
  openComposeModal(m.fromRole, 'رد: '+(m.subject||''));
}
function openComposeModal(prefillRole, prefillSubject){
  const roleOpts = ['<option value="all">جميع الأقسام</option>'].concat(
    ROLES.map(r=>`<option value="${r.id}" ${prefillRole===r.id?'selected':''}>${r.name}</option>`)
  ).join('');
  document.body.insertAdjacentHTML('beforeend', `
  <div class="modal-bg" id="composeModalBg">
    <div class="modal" style="max-width:560px;">
      <div class="modal-head"><h3>رسالة جديدة</h3><button class="modal-close" onclick="closeModal('composeModalBg')">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>إلى القسم *</label><select id="f_msgTo">${roleOpts}</select></div>
        <div class="field"><label>الموضوع *</label><input id="f_msgSubject" value="${prefillSubject?prefillSubject.replace(/"/g,'&quot;'):''}" placeholder="موضوع الرسالة"></div>
        <div class="field"><label>نص الرسالة *</label><textarea class="f-textarea" id="f_msgBody" style="min-height:140px;" placeholder="اكتب رسالتك هنا بصيغة رسمية ومهنية..."></textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal('composeModalBg')">إلغاء</button>
        <button class="btn btn-gold" onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>`);
}
function sendMessage(){
  const toRole = document.getElementById('f_msgTo').value;
  const subject = document.getElementById('f_msgSubject').value.trim();
  const body = document.getElementById('f_msgBody').value.trim();
  if(!subject || !body){ toast('الرجاء تعبئة الموضوع ونص الرسالة'); return; }
  const u = currentUser();
  const messages = dget(DBK.messages, []);
  messages.push({
    id: uid('msg'), fromUserId:u.id, fromName:u.name, fromRole:u.role,
    toRole, subject, body, at:new Date().toISOString(), readBy:[u.id]
  });
  dset(DBK.messages, messages);
  closeModal('composeModalBg');
  playNotificationTone();
  toast('تم إرسال الرسالة');
  pageMessages();
}

/* ======================= INIT ======================= */
async function retrySync(){
  if(!sb){ toast('عميل Supabase غير مهيأ (تحقق من اتصال الإنترنت وأعد تحميل الصفحة)', 6000); return; }
  toast('جارِ إعادة المحاولة...', 1500);
  const ok = await syncPullAll();
  if(ok){
    seed(true);
    if(currentUser()) route();
    subscribeRealtime();
    toast('تم الاتصال بنجاح ✅');
  } else {
    const errMsg = window.__syncError ? (window.__syncError.message || window.__syncError.toString() || JSON.stringify(window.__syncError)) : 'خطأ غير معروف';
    toast('لا يزال الاتصال فاشلاً: ' + errMsg, 9000);
  }
}
async function bootstrapApp(){
  route(); // render immediately with local-only data so the app is usable instantly
  if(sb){
    const ok = await syncPullAll();
    if(ok){
      seed(true); // now safe to push: any key genuinely missing on the server gets created, nothing real gets overwritten
      if(currentUser()) route(); // refresh with freshly synced data
      subscribeRealtime();
    } else {
      const errMsg = window.__syncError ? (window.__syncError.message || window.__syncError.toString() || JSON.stringify(window.__syncError)) : 'خطأ غير معروف';
      toast('تعذر الاتصال: ' + errMsg, 9000);
      console.error('Supabase sync error details:', window.__syncError);
    }
  }
}
bootstrapApp();
