function playNotificationTone(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const notes = [{f:783.99, t:0, g:0.15}, {f:1046.50, t:0.11, g:0.17}];
    notes.forEach(n=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = n.f;
      const start = ctx.currentTime + n.t;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(n.g, start+0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.45);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start+0.5);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 900);
  }catch(e){}
}
function inboxFor(user){
  return dget(DBK.messages, []).filter(m=> m.toRole===user.role || m.toRole==='all');
}
function checkNewMessagesTone(){
  const u = currentUser(); if(!u) return;
  const inbox = inboxFor(u);
  const unreadIds = inbox.filter(m=>!m.readBy.includes(u.id)).map(m=>m.id).sort();
  const key = 'taj_last_unread_'+u.id;
  let lastKnown = [];
  try{ lastKnown = JSON.parse(sessionStorage.getItem(key)||'[]'); }catch(e){}
  const isNew = unreadIds.some(id=>!lastKnown.includes(id));
  if(isNew && lastKnown.length>0){ playNotificationTone(); }
  sessionStorage.setItem(key, JSON.stringify(unreadIds));
}

  const u = currentUser(); if(!u) return;

}

function saveWorkshopChecklist(vehicleId, editMaintenanceId){
  try{
    const checklist = {};
    let missingEl = false;
    WORKSHOP_CHECKLIST_ITEMS.forEach(it=>{
      const el = document.getElementById('f_chk_'+it.id);
      if(!el){ missingEl = true; return; }
      checklist[it.id] = el.classList.contains('on');
    });
    if(missingEl){ toast('حدث خطأ في قراءة النموذج، الرجاء إغلاق النافذة والمحاولة من جديد', 5000); return; }
    const damageEl = document.getElementById('f_wsDamage');
    const techEl = document.getElementById('f_wsTech');
    const costEl = document.getElementById('f_wsCost');
    const damageNotes = damageEl? damageEl.value.trim() : '';
    const technicianName = techEl? techEl.value.trim() : '';
    const cost = costEl? costEl.value : '';
    const vehicles = dget(DBK.vehicles, []);
    const v = vehicles.find(x=>x.id===vehicleId);
    const u = currentUser();
    if(!u){ toast('انتهت جلسة الدخول، الرجاء تسجيل الدخول من جديد'); return; }
    let list = dget(DBK.maintenance, []);

    if(editMaintenanceId){
      const idx = list.findIndex(x=>x.id===editMaintenanceId);
      if(idx<0 || isMaintenanceConfirmed(list[idx])){
        toast('انتهت مهلة التعديل (5 دقائق) — تم اعتماد الطلب بالفعل ولا يمكن تعديله');
        closeModal('workshopModalBg'); renderWorkshopVehicleList(); return;
      }
      list[idx] = {...list[idx], cost, technicianName, checklist, damageNotes, lastSavedAt:new Date().toISOString()};
      dset(DBK.maintenance, list);
      pushVehicleEvent(vehicleId, 'تحديث صيانة', `تم تعديل بيانات الصيانة (${list[idx].maintenanceNo}) بواسطة مركز الصيانة (${u.name})`);
      logAudit('تعديل صيانة (بوابة ورشة)','الصيانة', `${u.name} عدّل بيانات صيانة السيارة ${v?v.plate:''} (${list[idx].maintenanceNo})`);
      closeModal('workshopModalBg');
      showWorkshopSummary(editMaintenanceId);
      renderMaintenanceBadge();
      return;
    }

    const maintenanceNo = 'MNT-'+String(list.length+1).padStart(4,'0');
    const nowIso = new Date().toISOString();
    const nowDateObj = new Date();
    const nm = {
      id:uid('mnt'), maintenanceNo, vehicleId, type:'صيانة دورية شاملة (بوابة الورشة)',
      date:nowIso.slice(0,10), time:nowDateObj.toTimeString().slice(0,5), cost, workshop:u.name, workshopPhone:u.phone||'',
      technicianName, checklist, damageNotes, lastSavedAt:nowIso, createdAt:nowIso
    };
    list.push(nm);
    dset(DBK.maintenance, list);
    if(v){
      const vIdx = vehicles.findIndex(x=>x.id===vehicleId);
      vehicles[vIdx].lastMaintenance = nm.date;
      dset(DBK.vehicles, vehicles);
    }
    // fulfil the matching dispatch so the vehicle disappears from the workshop's pending list
    const dispatches = dget(DBK.maintenanceDispatches, []);
    const dIdx = dispatches.findIndex(d=>d.vehicleId===vehicleId && d.status==='بانتظار الاستلام');
    if(dIdx>=0){
      dispatches[dIdx].status = 'تم الإدخال';
      dispatches[dIdx].fulfilledMaintenanceId = nm.id;
      dispatches[dIdx].fulfilledAt = nowIso;
      dset(DBK.maintenanceDispatches, dispatches);
    }
    pushVehicleEvent(vehicleId, 'صيانة', `تم تسجيل صيانة دورية شاملة من مركز الصيانة (${u.name}) — رقم ${maintenanceNo}`+(damageNotes? ' ⚠️ ملاحظة: يوجد صدمات/خدوش' : ''));
    logAudit('تسجيل صيانة (بوابة ورشة)','الصيانة', `${u.name} سجل صيانة للسيارة ${v?v.plate:''} (${maintenanceNo})`);
    closeModal('workshopModalBg');
    showWorkshopSummary(nm.id);
    renderMaintenanceBadge();
  }catch(err){
    console.error('saveWorkshopChecklist error:', err);
    toast('حدث خطأ أثناء الحفظ: ' + (err && err.message ? err.message : 'خطأ غير معروف'), 7000);
  }
}

function renderDeliveryOpsTable(){
  const records = dget(DBK.deliveryOps, []);

  if(deliveryOpFilter.q){
    const q = deliveryOpFilter.q.trim();

    list = list.filter(r=> matchIds.includes(r.driverId));

  const tbody = document.getElementById('deliveryOpsTbody');

  tbody.innerHTML = list.map(r=>{
    const drv = drivers.find(d=>d.id===r.driverId);
    const extra = (r.extraFields||[]).filter(f=>f.label).map(f=>`${f.label}: ${f.value}`).join('، ');

  const platformOpts = platforms.map(p=>`<option value="${p}" ${r.platform===p?'selected':''}>${p}</option>`).join('');
  const driverOpts = `<option value="">بدون تحديد</option>` + drivers.map(d=>`<option value="${d.id}" ${r.driverId===d.id?'selected':''}>${d.name}</option>`).join('');
  deliveryExtraFieldCount = 0;
  document.body.insertAdjacentHTML('beforeend', `
  <div class="modal-bg" id="deliveryOpModalBg">
    <div class="modal" style="max-width:600px;">
      <div class="modal-head"><h3>${id?'تعديل سجل توصيل':'سجل توصيل جديد'}</h3><button class="modal-close" onclick="closeModal('deliveryOpModalBg')">✕</button></div>
      <div class="modal-body">
        <div class="grid2">
          <div class="field"><label>المنصة / الشركة *</label><select id="f_dopPlatform">${platformOpts}</select></div>
          <div class="field"><label>المندوب *</label><select id="f_dopDriver">${driverOpts}</select></div>
          <div class="field"><label>عدد الطلبات الموصلة</label><input type="number" id="f_dopOrders" value="${r.ordersCount||''}"></div>
          <div class="field"><label>كلفة الوقود (ريال)</label><input type="number" id="f_dopFuel" value="${r.fuelCost||''}"></div>
          <div class="field"><label>التاريخ / الفترة</label><input type="date" id="f_dopDate" value="${r.date||''}"></div>
        </div>
        <div class="section-title"><span class="bar"></span>بنود إضافية (اختياري)</div>
        <div id="dopExtraFieldsWrap">
          ${(r.extraFields||[]).map(f=>renderExtraFieldRow(f.label, f.value)).join('')}
        </div>
        <button class="btn btn-ghost btn-sm" onclick="addExtraFieldRow()">+ إضافة بند</button>
        <div class="field" style="margin-top:14px;"><label>ملاحظات</label><textarea class="f-textarea" id="f_dopNotes">${r.notes||''}</textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal('deliveryOpModalBg')">إلغاء</button>
        <button class="btn btn-gold" onclick="saveDeliveryOp('${id||''}')">حفظ</button>
      </div>
    </div>
  </div>`);
  if((r.extraFields||[]).length) deliveryExtraFieldCount = r.extraFields.length;
}
function renderExtraFieldRow(label, value){
  const idx = deliveryExtraFieldCount++;
  return `<div class="grid2" id="dopExtraRow_${idx}" style="margin-bottom:8px;">
    <input placeholder="اسم البند (مثلاً: بدل انتظار)" class="dop-extra-label" value="${label? label.replace(/"/g,'&quot;') : ''}">
    <div style="display:flex; gap:6px;">
      <input placeholder="القيمة" class="dop-extra-value" value="${value!=null? String(value).replace(/"/g,'&quot;') : ''}" style="flex:1;">
      <button class="icon-link" onclick="document.getElementById('dopExtraRow_${idx}').remove()" title="حذف البند">✕</button>
    </div>
  </div>`;
}
function addExtraFieldRow(){
  document.getElementById('dopExtraFieldsWrap').insertAdjacentHTML('beforeend', renderExtraFieldRow('', ''));
}
function saveDeliveryOp(id){
  const platform = document.getElementById('f_dopPlatform').value;
  const driverId = document.getElementById('f_dopDriver').value;
  if(!platform || !driverId){ toast('الرجاء اختيار المنصة والمندوب'); return; }
  const labels = document.querySelectorAll('#dopExtraFieldsWrap .dop-extra-label');
  const values = document.querySelectorAll('#dopExtraFieldsWrap .dop-extra-value');
  const extraFields = [];
  labels.forEach((el,i)=>{ if(el.value.trim()) extraFields.push({label:el.value.trim(), value: values[i].value.trim()}); });
  const data = {
    platform, driverId,
    ordersCount: document.getElementById('f_dopOrders').value,
    fuelCost: document.getElementById('f_dopFuel').value,
    date: document.getElementById('f_dopDate').value,
    extraFields,
    notes: document.getElementById('f_dopNotes').value.trim(),
  };
  let list = dget(DBK.deliveryOps, []);
  const drivers = dget(DBK.drivers, []);
  const drv = drivers.find(d=>d.id===driverId);
  if(id){
    const idx = list.findIndex(x=>x.id===id);
    list[idx] = {...list[idx], ...data};
    logAudit('تعديل سجل توصيل','عمليات التوصيل', `تعديل سجل توصيل (${platform}) للمندوب "${drv?drv.name:''}"`);
  } else {
    list.push({id:uid('dop'), ...data, createdAt:new Date().toISOString()});
    logAudit('إضافة سجل توصيل','عمليات التوصيل', `تمت إضافة سجل توصيل (${platform}) للمندوب "${drv?drv.name:''}" — ${data.ordersCount||0} طلب`);
  }
  dset(DBK.deliveryOps, list);
  closeModal('deliveryOpModalBg');
  pageDeliveryOps();
  toast('تم الحفظ بنجاح');
}

/* ======================= INIT ======================= */
async function retrySync(){
  if(!sb){ toast('عميل Supabase غير مهيأ (تحقق من اتصال الإنترنت وأعد تحميل الصفحة)', 6000); return; }
  toast('جارِ إعادة المحاولة...', 1500);
  const ok = await syncPullAll();
  if(ok){
    seed(true);
    if(currentUser()) route();
    subscribeRealtime();
    toast('تم الاتصال بنجاح ✅');
  } else {
    const errMsg = window.__syncError ? (window.__syncError.message || window.__syncError.toString() || JSON.stringify(window.__syncError)) : 'خطأ غير معروف';
    toast('لا يزال الاتصال فاشلاً: ' + errMsg, 9000);
  }
}
async function bootstrapApp(){
  route(); // render immediately with local-only data so the app is usable instantly
  if(sb){
    const ok = await syncPullAll();
    if(ok){
      seed(true); // now safe to push: any key genuinely missing on the server gets created, nothing real gets overwritten
      if(currentUser()) route(); // refresh with freshly synced data
      subscribeRealtime();
    } else {
      const errMsg = window.__syncError ? (window.__syncError.message || window.__syncError.toString() || JSON.stringify(window.__syncError)) : 'خطأ غير معروف';
      toast('تعذر الاتصال: ' + errMsg, 9000);
      console.error('Supabase sync error details:', window.__syncError);
    }
  }
  if(currentUser()) checkConfirmedMaintenanceDialog();
  // keep the sidebar maintenance badge accurate over time even when the admin stays on another page
  // (confirmation is time-based, not event-based, so nothing else would trigger a refresh of the count)
  setInterval(()=>{ if(currentUser()) renderMaintenanceBadge(); }, 15000);
}
bootstrapApp();
</script>
